<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Card</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f4fd1'/%3E%3Crect x='7' y='10' width='18' height='13' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='12.5' cy='15.5' r='2' fill='white'/%3E%3Cpath d='M17 14.5h5M17 18h4' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3f3ef;
    --card: #ffffff;
    --text: #15171c;
    --muted: #5e6571;
    --line: #e7e6e0;
    --accent: #1f4fd1;
    --accent-ink: #ffffff;
    --soft: #edf1fb;
    --shadow: 0 1px 2px rgba(20, 22, 28, .05), 0 12px 32px -12px rgba(20, 22, 28, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --card: #171a1f;
      --text: #eceef2;
      --muted: #9aa2ae;
      --line: #282c33;
      --accent: #7ea4ff;
      --accent-ink: #0a1020;
      --soft: #1c2331;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -12px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
  [hidden] { display: none !important; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 28px 22px 22px;
  }

  /* stati: caricamento / bloccata */
  .state { text-align: center; padding: 48px 24px; }
  .state h1 { font-size: 20px; margin: 16px 0 6px; letter-spacing: -.01em; }
  .state p { margin: 0; color: var(--muted); }
  .state .ico {
    width: 56px; height: 56px; margin: 0 auto; border-radius: 16px;
    display: grid; place-items: center; background: var(--soft); color: var(--accent);
  }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--soft); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  /* card */
  .hero { text-align: center; }
  .avatar {
    width: 104px; height: 104px; margin: 0 auto 16px; border-radius: 50%;
    background: var(--soft); color: var(--accent);
    display: grid; place-items: center; overflow: hidden;
    font-size: 36px; font-weight: 650; letter-spacing: .02em;
    border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1.name { font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -.02em; font-weight: 700; }
  .role { margin: 6px 0 0; color: var(--muted); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 52px; padding: 0 18px; border-radius: 14px;
    font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn[aria-disabled="true"] { opacity: .55; pointer-events: none; }
  .btn svg { flex: none; }
  .save { margin-top: 22px; }

  .rows { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .rows li { border-bottom: 1px solid var(--line); }
  .rows a {
    display: flex; align-items: center; gap: 14px; padding: 14px 2px;
    color: inherit; text-decoration: none; min-height: 60px;
  }
  .rows .ri {
    width: 40px; height: 40px; flex: none; border-radius: 12px;
    display: grid; place-items: center; background: var(--soft); color: var(--accent);
  }
  .rows .rt { min-width: 0; flex: 1; }
  .rows .rl { display: block; font-size: 13px; color: var(--muted); }
  .rows .rv { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rows .chev { color: var(--muted); flex: none; }

  .cv { padding: 20px 22px 22px; }
  .cv-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .cv-head .ri {
    width: 44px; height: 44px; border-radius: 12px; flex: none;
    display: grid; place-items: center; background: var(--soft); color: var(--accent);
  }
  .cv-head h2 { font-size: 17px; margin: 0; }
  .cv-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .cv-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; justify-content: center; }
  a:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 14px; }
</style>
</head>
<body>
<main>
  <section id="loading" class="panel state" aria-live="polite">
    <div class="ico"><div class="spinner" aria-hidden="true"></div></div>
    <h1>Apro la card…</h1>
    <p>Un attimo, sto decifrando i dati.</p>
  </section>

  <section id="locked" class="panel state" hidden>
    <div class="ico">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
    </div>
    <h1>Questa card è privata</h1>
    <p>Per vederla, inquadra il QR che ti è stato mostrato.</p>
  </section>

  <article id="card" class="panel" hidden>
    <header class="hero">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <h1 class="name" id="name"></h1>
      <p class="role" id="role" hidden></p>
    </header>
    <a id="save" class="btn primary save" href="#" role="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M19 8v6M16 11h6"/></svg>
      Salva contatto
    </a>
    <ul class="rows" id="rows"></ul>
  </article>

  <section id="cv" class="panel cv" hidden>
    <div class="cv-head">
      <div class="ri">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      </div>
      <div>
        <h2>Curriculum Vitae</h2>
        <p id="cvMeta">Preparo il PDF…</p>
      </div>
    </div>
    <div class="cv-actions">
      <a id="cvOpen" class="btn" target="_blank" rel="noopener" aria-disabled="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        Apri
      </a>
      <a id="cvDownload" class="btn primary" aria-disabled="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        Scarica
      </a>
    </div>
  </section>

  <footer id="foot" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
    Dati cifrati, visibili solo tramite QR
  </footer>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  const ICONS = {
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6 8.5-6"/>',
    whatsapp: '<path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-.9.8a4 4 0 0 1-2.2-2.2l.8-.9-1-2z"/>',
    linkedin: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V17M8 7.5v.01M12 17v-6.5M12 13.5a2.5 2.5 0 0 1 5 0V17"/>',
    github: '<path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    pin: '<path d="M12 21s7-6.1 7-11.5a7 7 0 0 0-14 0C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    link: '<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>'
  };
  const svg = (name, size = 20) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.link}</svg>`;
  const CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

  function show(id) {
    for (const s of ["loading", "locked", "card"]) $(s).hidden = s !== id;
    $("foot").hidden = id !== "card";
  }

  function b64uToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  }

  async function openBox(key, path) {
    const res = await fetch(path, { cache: "no-store" });
    if (!res.ok) throw new Error("not found");
    const buf = new Uint8Array(await res.arrayBuffer());
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
  }

  // ---------- vCard ----------
  const esc = (v) => String(v).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  function fold(line) {
    // vCard: righe max 75 caratteri, continuazione con spazio iniziale
    const out = [];
    while (line.length > 75) { out.push(line.slice(0, 75)); line = " " + line.slice(75); }
    out.push(line);
    return out.join("\r\n");
  }
  function buildVCard(d) {
    const L = ["BEGIN:VCARD", "VERSION:3.0"];
    L.push(`N:${esc(d.lastName || "")};${esc(d.firstName || "")};;;`);
    L.push(`FN:${esc(d.name)}`);
    if (d.company) L.push(`ORG:${esc(d.company)}`);
    if (d.role) L.push(`TITLE:${esc(d.role)}`);
    if (d.phone) L.push(`TEL;TYPE=CELL,VOICE:${d.phone}`);
    if (d.email) L.push(`EMAIL;TYPE=INTERNET,PREF:${d.email}`);
    for (const l of d.links || []) L.push(`URL:${l.url}`);
    if (d.city) L.push(`ADR;TYPE=WORK:;;;${esc(d.city)};;;`);
    if (d.note) L.push(`NOTE:${esc(d.note)}`);
    if (d.photo) {
      const m = /^data:image\/(jpeg|png);base64,(.+)$/.exec(d.photo);
      if (m) L.push(`PHOTO;ENCODING=b;TYPE=${m[1].toUpperCase()}:${m[2]}`);
    }
    L.push("END:VCARD");
    return L.map(fold).join("\r\n") + "\r\n";
  }
  const fileSafe = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");

  // ---------- render ----------
  function row(icon, label, value, href) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = href;
    if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.innerHTML = `<span class="ri">${svg(icon)}</span><span class="rt"><span class="rl"></span><span class="rv"></span></span>${CHEV}`;
    a.querySelector(".rl").textContent = label;
    a.querySelector(".rv").textContent = value;
    li.appendChild(a);
    return li;
  }
  const prettyUrl = (u) => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");

  function render(d) {
    document.title = d.name;
    $("name").textContent = d.name;
    const role = [d.role, d.company].filter(Boolean).join(" · ");
    if (role) { $("role").textContent = role; $("role").hidden = false; }

    const av = $("avatar");
    if (d.photo) {
      const img = new Image();
      img.alt = "";
      img.src = d.photo;
      av.appendChild(img);
    } else {
      av.textContent = (d.name.match(/\b\p{L}/gu) || []).slice(0, 2).join("").toUpperCase();
    }

    const rows = $("rows");
    if (d.phone) rows.appendChild(row("phone", "Telefono", d.phoneDisplay || d.phone, "tel:" + d.phone.replace(/\s+/g, "")));
    if (d.whatsapp && d.phone) rows.appendChild(row("whatsapp", "WhatsApp", "Scrivimi su WhatsApp", "https://wa.me/" + d.phone.replace(/\D/g, "")));
    if (d.email) rows.appendChild(row("mail", "Email", d.email, "mailto:" + d.email));
    for (const l of d.links || []) rows.appendChild(row(l.icon || "link", l.label, l.display || prettyUrl(l.url), l.url));
    if (d.city) rows.appendChild(row("pin", "Dove", d.city, "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d.city)));

    const vcf = new Blob([buildVCard(d)], { type: "text/vcard;charset=utf-8" });
    const save = $("save");
    save.href = URL.createObjectURL(vcf);
    save.download = fileSafe(d.name) + ".vcf";

    show("card");
  }

  async function loadCv(key, cv) {
    $("cv").hidden = false;
    try {
      const pdf = await openBox(key, cv.file);
      const blob = new Blob([pdf], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const open = $("cvOpen"), dl = $("cvDownload");
      open.href = url;
      dl.href = url;
      dl.download = cv.name || "CV.pdf";
      open.removeAttribute("aria-disabled");
      dl.removeAttribute("aria-disabled");
      const kb = blob.size / 1024;
      $("cvMeta").textContent = "PDF · " + (kb > 1024 ? (kb / 1024).toFixed(1) + " MB" : Math.round(kb) + " KB");
    } catch (e) {
      $("cvMeta").textContent = "Il CV non è più disponibile.";
    }
  }

  async function main() {
    const m = /^#([A-Za-z0-9]{6,40})\.([A-Za-z0-9_-]{43})$/.exec(location.hash);
    if (!m || !window.crypto || !crypto.subtle) return show("locked");
    try {
      const key = await crypto.subtle.importKey("raw", b64uToBytes(m[2]), "AES-GCM", false, ["decrypt"]);
      const data = JSON.parse(new TextDecoder().decode(await openBox(key, "c/" + m[1] + ".bin")));
      render(data);
      if (data.cv) loadCv(key, data.cv);
    } catch (e) {
      show("locked");
    }
  }

  window.addEventListener("hashchange", () => location.reload());
  main();
})();
</script>
</body>
</html>
